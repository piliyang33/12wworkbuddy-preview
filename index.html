<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>12 周工作台</title>
<style>
  :root{
    --indigo:#6366f1; --violet:#8b5cf6; --emerald:#10b981; --amber:#f59e0b;
    --rose:#f43f5e; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --bg:#f5f7fb; --card:#ffffff; --soft:#eef2ff;
    --shadow:0 6px 20px rgba(30,41,59,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:480px; margin:0 auto; min-height:100vh;}

  /* ---- header (per-view) ---- */
  .page-header{
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    color:#fff; padding:18px 16px 14px; border-radius:0 0 20px 20px;
    box-shadow:var(--shadow); margin-bottom:14px;
  }
  .page-header h1{margin:0; font-size:19px; letter-spacing:.3px; font-weight:800;}
  .page-header p{margin:3px 0 0; font-size:12px; opacity:.85;}
  .ph-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .help-btn{background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.35); padding:6px 10px; font-size:12px; border-radius:999px; flex:0 0 auto;}

  .pad{padding:14px 14px 4px;}
  .card{background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow); margin-bottom:12px;}
  .card h3{margin:0 0 8px; font-size:15px; display:flex; align-items:center; gap:7px;}
  .muted{color:var(--muted); font-size:12.5px;}
  .pill{display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; background:var(--soft); color:var(--indigo); font-weight:700;}
  .row{display:flex; gap:10px; align-items:center;}
  .between{justify-content:space-between;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* buttons */
  button{font-family:inherit; cursor:pointer; border:none; border-radius:11px; font-weight:700; font-size:13px; transition:.15s;}
  button:active{transform:scale(.97);}
  .btn{padding:9px 13px; background:var(--soft); color:var(--indigo);}
  .btn.primary{background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff;}
  .btn.ghost{background:transparent; color:var(--muted); padding:7px 9px;}
  .btn.sm{padding:6px 10px; font-size:12px;}
  .btn.full{width:100%; justify-content:center;}
  .btn.danger{background:#fff1f2; color:var(--rose);}
  .btn.viole{background:linear-gradient(135deg,var(--violet),var(--indigo)); color:#fff;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  input,select,textarea{
    font-family:inherit; font-size:14px; width:100%; padding:10px 12px;
    border:1px solid var(--line); border-radius:11px; background:#fff; color:var(--ink); outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--indigo);}
  textarea{resize:vertical; min-height:56px;}
  label.fld{display:block; font-size:12.5px; color:var(--muted); margin:9px 0 4px; font-weight:700;}

  /* project card */
  .proj{border:1px solid var(--line); border-radius:15px; padding:13px; margin-bottom:10px; background:#fff;}
  .proj-head{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
  .proj-head .ptitle{flex:1; font-size:15.5px; font-weight:800;}
  .proj-edit-btn{flex:0 0 auto; padding:5px 10px; font-size:11.5px; background:var(--soft); color:var(--indigo); border-radius:8px; font-weight:700;}
  .proj .ptitle{font-size:15.5px; font-weight:800; margin-bottom:3px;}
  .proj .pmeta{font-size:11.5px; color:var(--muted); margin-bottom:5px;}
  .proj .pacts{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px;}
  .pchips{display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 2px;}
  .pchip{font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--soft); color:var(--indigo); font-weight:700;}

  /* 项目背景折叠 */
  .pbg-toggle{font-size:11px; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:3px; margin-bottom:5px; user-select:none;-webkit-user-select:none;}
  .pbg-toggle:hover{color:var(--indigo);}
  .pbg-body{display:none; font-size:11.5px; color:var(--muted); line-height:1.45; padding:8px 10px; background:#fafbfd; border-radius:9px; margin-bottom:6px; word-break:break-all;}
  .pbg-body.show{display:block;}

  /* 项目进度条 */
  .proj-progress{margin:6px 0 4px;}
  .pp-bar{height:7px; border-radius:999px; background:#eef2f7; overflow:hidden;}
  .pp-bar > i{display:block; height:100%; border-radius:999px; transition:width .35s;}
  .pp-info{display:flex; justify-content:space-between; align-items:center; margin-top:3px;}
  .pp-label{font-size:10.5px; color:var(--muted);}
  .pp-pct{font-size:12px; font-weight:800;}

  /* 滞后指标进度标签（进度条式填充） */
  .lag-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .ltag{position:relative; overflow:hidden; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; border:1px solid var(--line); background:#f8fafc; color:var(--ink);}
  .ltag-fill{position:absolute; left:0; top:0; bottom:0; opacity:.22;}
  .ltag-txt{position:relative; z-index:1; white-space:nowrap;}

  /* 今天页小进度条 */
  .mini-bar{height:6px; border-radius:999px; background:#eef2f7; overflow:hidden; margin:3px 0 2px;}
  .mini-bar > i{display:block; height:100%; border-radius:999px; transition:width .35s;}
  .mini-cap{font-size:10.5px; color:var(--muted); margin-bottom:6px;}

  /* 详情页：滞后指标行 + 周分组折叠 */
  .lag-row{padding:9px 0; border-bottom:1px solid #f1f5f9;}
  .lag-row:last-child{border-bottom:none;}
  .lag-name{font-size:13px; font-weight:700;}
  .lag-sub{font-size:10.5px; color:var(--muted); margin:1px 0 5px;}
  .lag-input-row{display:flex; align-items:center; gap:8px; margin-bottom:5px;}
  .lag-actual2{flex:1; min-width:0; padding:10px 12px !important; font-size:14px !important; border:2px solid var(--line); border-radius:10px; background:#fafbfc; transition:border-color .15s;}
  .lag-actual2:focus{border-color:var(--indigo); background:#fff; outline:none; box-shadow:0 0 0 3px rgba(99,102,241,.12);}
  .lag-pct2{flex:0 0 auto; font-weight:800; font-size:14px; min-width:42px; text-align:right;}
  .wk-toggle{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:800; color:var(--indigo); padding:8px 2px; cursor:pointer; user-select:none;-webkit-user-select:none;}
  .wk-body{display:none; padding:2px 0 4px;}
  .wk-body.show{display:block;}
  .wk-add{font-size:11px; color:var(--indigo); background:var(--soft); border:none; border-radius:8px; padding:3px 9px; font-weight:700; cursor:pointer; flex:0 0 auto; margin-left:6px;}

  /* 任务拖拽 */
  .item.dragging{opacity:.35; transform:scale(.98);}
  .drop-over{border:2px dashed var(--indigo); border-radius:10px; background:#eef2ff; transition:.15s;}

  /* 今天页：今天必做 + 优先级 + 截止 */
  .mustdo-zone{background:#fff7ed; border:1px solid #fed7aa; border-radius:12px; padding:8px 10px; margin-bottom:10px;}
  .mustdo-zone .md-empty,.md-rest-title+.md-empty,.md-empty{font-size:11px; color:var(--muted); text-align:center; padding:8px 0; line-height:1.4;}
  [data-drop="rest"]{min-height:8px;}
  .md-title{font-size:12.5px; font-weight:800; color:#c2410c; margin-bottom:5px;}
  .md-rest-title{font-size:12px; font-weight:800; color:var(--muted); margin:2px 0 5px;}
  /* 拖拽手柄：只在每条任务最左边，必须抓它才能拖动，避免下滑误触 */
  .grip{flex:0 0 auto;width:20px;align-self:stretch;min-height:22px;display:flex;align-items:center;justify-content:center;margin-right:-6px;color:var(--muted);cursor:grab;font-size:12px;line-height:1;-webkit-user-select:none;user-select:none;touch-action:none;}
  .grip::before{content:'⋮⋮';letter-spacing:1px;}
  .grip:active{color:var(--indigo);}
  .it-title,.h-title,.ph-name{cursor:pointer;}
  .pdot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:middle; flex:0 0 auto;}
  .due-badge{font-size:10px; color:var(--muted); margin-left:6px;}
  .due-badge.urgent{color:var(--rose); font-weight:800;}

  /* 个人习惯卡片 */
  .proj.personal{border-color:var(--violet); background:linear-gradient(135deg,#faf5ff,#eef2ff);}
  /* 个人习惯列表 */
  .ph-list{margin:2px 0 2px;}
  .ph-item{padding:9px 2px; border-bottom:1px solid #f1f5f9;}
  .ph-item:last-child{border-bottom:none;}
  .ph-name{font-size:14px; font-weight:700;}
  .ph-sub{font-size:11px; color:var(--muted); margin-top:2px;}

  /* 感悟（今日/本周） */
  .jbox{border:none;}
  .jsum{cursor:pointer; font-size:13px; font-weight:800; color:var(--indigo); list-style:none; user-select:none;}
  .jsum::-webkit-details-marker{display:none;}
  .jsum::before{content:'▾ ';}
  details[open] .jsum::before{content:'▴ ';}
  .jarea{width:100%; margin-top:8px; min-height:84px; resize:vertical; line-height:1.5;}
  .jhint{font-size:10px; color:var(--muted); margin-top:4px;}
  .streak{font-size:10px;color:var(--amber);font-weight:800;margin-left:6px;}

  /* item list */
  .item{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #f1f5f9;}
  .item:last-child{border-bottom:none;}
  .item .chk{width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex:0 0 auto; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; cursor:pointer; user-select:none;-webkit-user-select:none;}
  .item.done .chk{background:var(--emerald); border-color:var(--emerald);}
  .item.done .it-title{text-decoration:line-through; color:var(--muted);}
  .it-title{font-size:14px; font-weight:600; flex:1; line-height:1.35;}
  .itag{font-size:10px; padding:1px 6px; border-radius:999px; background:var(--soft); color:var(--indigo); font-weight:700; white-space:nowrap; flex:0 0 auto; margin-top:3px;}

  /* habit day-grid */
  .habit-item{padding:8px 0; border-bottom:1px solid #f1f5f9;}
  .habit-item:last-child{border-bottom:none;}
  .h-head{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .h-title{font-size:14px; font-weight:700; flex:1;}
  .h-pct{font-size:13px; font-weight:800; color:var(--emerald); flex:0 0 auto; min-width:38px; text-align:right;}
  .h-sub{font-size:11px; color:var(--muted);}
  .day-grid{display:flex; gap:4px;}
  .day-chk{width:34px; height:34px; flex:0 0 auto; border-radius:8px; border:2px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--muted); cursor:pointer; user-select:none;-webkit-user-select:none; transition:.15s;}
  .day-chk.on{background:var(--emerald); border-color:var(--emerald); color:#fff;}
  .day-chk.future{opacity:.35;}
  .day-names{display:flex; gap:4px; margin-bottom:3px;}
  .day-names span{width:34px; text-align:center; font-size:10px; font-weight:700; color:var(--muted); flex:0 0 auto;}

  /* completed tasks inline */
  .done-list{margin-top:5px; border-top:1px dashed #e2e8f0; padding-top:5px;}

  /* rings */
  .rings{display:flex; gap:12px; justify-content:center; margin:6px 0 4px;}
  .ring{width:110px; height:110px;}
  .ring-bg{fill:none; stroke:#eef2f7; stroke-width:10;}
  .ring-fg{fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .5s;}
  .ring-pct{text-anchor:middle; font-size:21px; font-weight:800; fill:var(--ink);}
  .ring-sub{text-anchor:middle; font-size:10px; fill:var(--muted);}
  .ring-label{text-align:center; font-size:12px; color:var(--muted); margin-top:-3px;}

  .progress{height:9px; border-radius:999px; background:#eef2f7; overflow:hidden; margin:8px 0;}
  .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--indigo),var(--violet));}

  /* week nav */
  .weekbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .weekdots{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 4px;}
  .dot{width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:11px; font-weight:700; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .dot.on{background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff; border:none;}
  .dot.done{background:#ecfdf5; color:var(--emerald); border-color:#a7f3d0;}

  /* lagging in review */
  .lag-rec{display:flex; align-items:center; gap:7px; padding:7px 0; border-bottom:1px solid #f1f5f9;}
  .lag-rec:last-child{border-bottom:none;}
  .lag-rec-main{flex:1; min-width:0;}
  .lag-rec-name{font-size:12.5px; font-weight:700; line-height:1.3;}
  .lag-actual{flex:0 0 78px; width:78px; padding:7px 7px; text-align:center; font-size:13px !important;}
  .lag-pct{flex:0 0 46px; text-align:right; font-weight:800; font-size:14px; color:var(--emerald);}

  /* task group by week */
  .wk-group{margin-bottom:14px;}
  .wk-group-title{font-size:13px; font-weight:800; color:var(--indigo); margin:8px 0 4px; padding-left:2px;}

  /* 复盘页：项目卡片 + 周柱状图 */
  .rev-card{border:1px solid var(--line); border-radius:15px; padding:12px; margin-bottom:10px; background:#fff; position:relative;}
  .rev-card .rctitle{font-size:15px; font-weight:800; margin-bottom:4px; padding-right:104px;}
  .rev-detail-btn{position:absolute; top:10px; right:10px; font-size:11px; font-weight:700; padding:5px 9px; border-radius:8px; border:1px solid var(--indigo); color:var(--indigo); background:#fff; cursor:pointer; white-space:nowrap;}
  .rev-detail-btn:active{background:var(--indigo); color:#fff;}
  .rev-lag-mini{display:flex; flex-wrap:wrap; gap:5px; margin:6px 0;}
  .rlm-tag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:#f1f5f9; color:var(--ink);}
  .bar-chart{display:flex; align-items:flex-end; gap:3px; height:72px; margin-top:8px; padding:0 2px;}
  .bc-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:0;}
  .bc-bar{width:100%; max-width:28px; border-radius:4px 4px 0 0; transition:height .35s; min-height:3px; position:relative; display:flex; align-items:center; justify-content:center;}
  .bc-lbl{font-size:8px; color:var(--muted); margin-top:2px; font-weight:700;}
  .bc-bar.sel{outline:2px solid var(--indigo); outline-offset:0;}
  .bc-now{color:var(--indigo); font-weight:800;}
  .bc-pct{font-size:7.5px; color:var(--muted); margin-bottom:1px;}
  .bc-pct-in{font-size:8.5px; font-weight:800; color:#fff; line-height:1; text-shadow:0 0 2px rgba(0,0,0,.25);}

  /* 复盘详情：移到下周按钮 */
  .btn-nextwk{font-size:11px; padding:4px 9px; background:var(--soft); color:var(--indigo); border:none; border-radius:8px; font-weight:700; cursor:pointer; flex:0 0 auto;}

  /* bottom nav - 4 tabs */
  nav.bottom{position:fixed; left:0; right:0; bottom:0; background:#fff; box-shadow:0 -4px 18px rgba(30,41,59,.08); display:flex; max-width:480px; margin:0 auto; padding:7px 5px calc(7px + env(safe-area-inset-bottom)); border-radius:17px 17px 0 0;}
  nav.bottom button{flex:1; background:transparent; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; padding:5px 0;}
  nav.bottom button .ic{font-size:18px;}
  nav.bottom button.on{color:var(--indigo);}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:end; justify-content:center; z-index:50;}
  .sheet{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; max-height:90vh; overflow:auto; padding:16px 14px calc(18px + env(safe-area-inset-bottom)); animation:up .2s ease;}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .sheet h2{margin:0 0 3px; font-size:17px; font-weight:800;}
  .sheet .sub{color:var(--muted); font-size:12px; margin-bottom:11px;}

  /* plan / edit rows inside modal */
  .plan-bg{background:var(--soft); border-radius:11px; padding:8px 10px; font-size:12px; color:var(--indigo); margin:3px 0 7px; line-height:1.5;}
  .plan-row{border-bottom:1px solid #eef2f7; padding:10px 0;}
  .plan-row:last-child{border-bottom:none;}
  .plan-in{width:100%; margin-bottom:7px; font-size:14px !important; padding:10px 12px !important;}
  .plan-meta{display:flex; gap:7px; align-items:center; flex-wrap:wrap;}
  .plan-line{display:flex; gap:6px; align-items:center; flex-wrap:nowrap; margin-bottom:7px;}
  .plan-line .lbl{font-size:11px; color:var(--muted); flex:0 0 auto; white-space:nowrap;}
  .plan-sel{width:auto; flex:0 0 auto; min-width:56px; text-align:center; padding:8px 8px !important; margin-bottom:0 !important;}
  .del.sm{padding:5px 8px; font-size:11.5px; flex:0 0 auto;}

  .toast{position:fixed; left:50%; top:16px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 15px; border-radius:11px; font-size:12.5px; z-index:99; box-shadow:var(--shadow); opacity:0; transition:.25s; pointer-events:none; max-width:90%;}
  .toast.show{opacity:1; top:24px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:20px 8px;}
  .hint{font-size:11px; color:var(--muted); margin-top:5px;}
  .spinner{display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:5px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sec-title{font-size:12.5px; font-weight:800; color:var(--muted); margin:7px 0 6px; letter-spacing:.4px;}
  .refl-week{font-size:13px; line-height:1.6; color:var(--ink); white-space:pre-wrap; background:#f7f8fb; border-radius:10px; padding:10px; margin-bottom:8px;}
  .refl-sub{font-size:11px; color:var(--muted); font-weight:700; margin:4px 0 6px;}
  .refl-day{margin-bottom:7px;}
  .refl-date{display:inline-block; font-size:11px; color:var(--indigo); font-weight:800; margin-bottom:2px;}
  .refl-txt{font-size:12.5px; line-height:1.55; color:var(--ink); white-space:pre-wrap; background:#f7f8fb; border-radius:8px; padding:7px 9px;}
</style>
</head>
<body>
<div class="wrap">
  <main id="app"></main>
</div>

<nav class="bottom" id="nav">
  <button data-view="today" class="on"><span class="ic">📋</span>今天</button>
  <button data-view="projects"><span class="ic">🎯</span>项目</button>
  <button data-view="review"><span class="ic">📊</span>复盘</button>
  <button data-view="settings"><span class="ic">⚙️</span>设置</button>
</nav>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ 数据层 ============================ */
const STORE_KEY = 'twelveWeekWorkbench.v2';
const DAY_NAMES = ['一','二','三','四','五','六','日'];
function defaultState(){
  return { version:2, goals:[], currentWeek:1, currentDay: todayWeekday(), anchor:null, viewWeek:1,
    settings:{ provider:'gemini', apiKey:'', model:'', baseUrl:'' },
    habitLog:{}, taskLog:{}, indicatorLog:{}, journal:{}, weekJournal:{} };
}
function todayWeekday(){ const d=new Date(); let r=d.getDay()-1; return r<0?6:r; } // Mon=0 .. Sun=6
// 真实日期工具
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function todayRealLabel(){ const d=new Date(); return fmtDate(d)+'（周'+DAY_NAMES[todayWeekday()]+'）'; }
// 两个日期相差天数（按本地零点算，b-a）
function diffDays(aStr,bDate){
  const a=new Date(aStr+'T00:00:00');
  const b=new Date(bDate.getFullYear()+'-'+String(bDate.getMonth()+1).padStart(2,'0')+'-'+String(bDate.getDate()).padStart(2,'0')+'T00:00:00');
  return Math.round((b-a)/86400000);
}
// 第 w 周对应的 7 个真实日期（按锚点推导；无锚点返回 []）
function weekDates(w){
  const a=state.anchor;
  if(!a||!a.startDate) return [];
  const base=new Date(a.startDate+'T00:00:00');
  const out=[];
  for(let d=0;d<7;d++){
    const off=(w-(a.startWeek||1))*7 + (d-(a.startDay||0));
    out.push(new Date(base.getTime()+off*86400000));
  }
  return out;
}
// 由锚点 + 真实日期推导「本周/今天」，并设置查看周
function syncAnchor(){
  const a=state.anchor;
  if(a&&a.startDate){
    const d=diffDays(a.startDate,new Date());
    let wk=a.startWeek+Math.floor(d/7);
    wk=Math.max(1,Math.min(12,wk));
    let day=(((a.startDay||0)+d)%7+7)%7;
    state.currentWeek=wk; state.currentDay=day;
  } else {
    state.currentWeek=1; state.currentDay=todayWeekday();
  }
  if(!state.viewWeek) state.viewWeek=state.currentWeek;
}

function migrate(s){
  if(!s.version || s.version<2){
    s.currentDay = s.currentDay!=null ? s.currentDay : todayWeekday();
    if(s.anchor===undefined) s.anchor=null;
    if(s.viewWeek===undefined) s.viewWeek=(s.currentWeek||1);
    // 滞后指标迁移
    (s.goals||[]).forEach(g=>{
      if(typeof g.lagging==='string'){ g.lagging=g.lagging?[{id:uid(),name:g.lagging,target:null,dir:'up'}]:[]; }
      if(!Array.isArray(g.lagging)) g.lagging=[];
      g.lagging.forEach(it=>{
        if(!it||typeof it==='string') it={id:uid(),name:String(it||''),target:null,dir:'up'};
        if(!it.id) it.id=uid();
        if(typeof it.name!=='string') it.name=(typeof it.text==='string')?it.text:String(it.name||'');
        it.target=(it.target==null||it.target==='')?null:Number(it.target);
        it.dir=(it.dir==='down')?'down':'up';
      });
      delete g.leading;
      // 任务：补齐优先级/截止/必做字段
      (g.tasks||[]).forEach(t=>{
        if(!t.priority||!['low','mid','high'].includes(t.priority)) t.priority='mid';
        if(t.due===undefined) t.due=null;
        if(t.mustDo===undefined) t.mustDo=false;
        if(!t.log) t.log={};
      });
      if(!Array.isArray(g.habits)) g.habits=[];
      (g.habits||[]).forEach(hb=>{ if(hb.startDate===undefined) hb.startDate=null; if(!hb.log) hb.log={}; if(!Array.isArray(hb.weeks)) hb.weeks=[]; });
    });
    // habitLog: number → [bool×7]
    if(s.habitLog) Object.keys(s.habitLog).forEach(hid=>{
      const weeks=s.habitLog[hid]; if(!weeks||typeof weeks!=='object') return;
      Object.keys(weeks).forEach(w=>{
        const v=weeks[w];
        if(typeof v==='number'){ weeks[w]=makeDays(v); }
        else if(Array.isArray(v)&&v.length===7){ /* already new format */ }
        else { weeks[w]=makeDays(0); }
      });
    });
    s.version=2;
  }
  return s;
}
function makeDays(n){ const a=Array(7).fill(false); for(let i=0;i<Math.min(7,n);i++)a[i]=true; return a; }

async function aiChat(system,user){
  const s=state.settings; if(!s.apiKey) throw new Error('NO_KEY');
  if(s.provider==='gemini'){
    const url=`${s.baseUrl||PROVIDERS.gemini.base}/models/${s.model||PROVIDERS.gemini.model}:generateContent?key=${encodeURIComponent(s.apiKey)}`;
    const body={contents:[{role:'user',parts:[{text:system+'\n\n'+user}]}],generationConfig:{responseMimeType:'application/json'}};

  }else{
    const p=PROVIDERS[s.provider]||PROVIDERS.openai;
    const url=`${s.baseUrl||p.base}/chat/completions`;
    const body={model:s.model||p.model,temperature:0.7,messages:[{role:'system',content:system},{role:'user',content:user}]};
    if(s.provider==='openai'||s.provider==='deepseek') body.response_format={type:'json_object'};

    const j=await r.json(); if(j.error) throw new Error(j.error.message||'API 错误');

  }

function todayKey(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function isUrgent(t){ if(!t||!t.due)return false; return t.due<=todayKey(); }
function sortTasksForToday(a,b){
  const ua=isUrgent(a.t), ub=isUrgent(b.t);
  if(ua!==ub) return ua?-1:1;
  const pw={'high':3,'mid':2,'low':1};
  const pa=pw[a.t.priority||'mid'], pb=pw[b.t.priority||'mid'];
  if(pa!==pb) return pb-pa;
  return 0;
}
function setMustDo(gid,tid,val){
  const g=findGoal(gid); if(!g)return;
  const tk=g.tasks.find(x=>x.id===tid); if(!tk)return;
  if(!!tk.mustDo===!!val)return;
  tk.mustDo=!!val; save(); render();
  toast(val?'已加入今天必做':'已移出今天必做');
}
function habitActiveInWeek(hb,w){ return Array.isArray(hb.weeks)&&hb.weeks.includes(w); }
function weekPlan(w){
  const tasks=[],habits=[];
  state.goals.forEach(g=>{
    (g.tasks||[]).forEach(t=>{ if(t.week===w) tasks.push({g,t}); });
    (g.habits||[]).forEach(hb=>{ if(habitActiveInWeek(hb,w)) habits.push({g,hb}); });
  });
  return{tasks,habits};
}
// 习惯本周完成天数（新数据模型：数组）
function habitDoneCount(hb,w){
  const d=getHabitDays(hb.id,w); return d?d.filter(Boolean).length:0;
}
function getHabitDays(hid,w){
  state.habitLog[hid]=state.habitLog[hid]||{};
  if(!state.habitLog[hid][w]||!Array.isArray(state.habitLog[hid][w])) state.habitLog[hid][w]=makeDays(0);
  return state.habitLog[hid][w];
}
function setHabitDay(hid,w,d,val){

// 本周评分
function scoreWeek(w){
  const{tasks,habits}=weekPlan(w);
  const td=tasks.filter(x=>x.t.log&&x.t.log[w]).length,tp=tasks.length;
  let hp=0,ha=0;
  habits.forEach(x=>{
    hp+=(x.hb.perWeek||1);
    ha+=habitDoneCount(x.hb,w);
  });
  return{
    tasksPct:tp?Math.round(td/tp*100):null,tasksDone:td,tasksDue:tp,
    habitsPct:hp?Math.round(ha/hp*100):null,habitsDone:ha,habitsPlan:hp
  };
}
function lagPct(it,actual){
  const t=Number(it.target); if(!t||actual===''||actual==null)return null;
  const a=Number(actual); if(isNaN(a))return null;
  var raw = (it.dir==='down') ? (a<=0?100:(t/a)*100) : ((a/t)*100);
  return Math.round(Math.max(0,raw));
}
// 统一配色（按《12周工作法》：85% 即出色=绿，50-85%=黄，<50%=红；无数据=灰）
function scoreColor(pct){
  if(pct===null||pct===''||pct===undefined) return 'var(--muted)';
  pct=Number(pct);
  if(pct>=85) return 'var(--emerald)';
  if(pct>=50) return 'var(--amber)';
  return 'var(--rose)';
}
function scoreFill(pct){
  if(pct===null||pct===''||pct===undefined) return '#eef2f7';
  pct=Number(pct);
  if(pct>=85) return 'linear-gradient(90deg,#10b981,#34d399)';
  if(pct>=50) return 'linear-gradient(90deg,#f59e0b,#fbbf24)';
  return 'linear-gradient(90deg,#ef4444,#f87171)';
}

function projectWeekScore(g,w){

  return{
    tasksPct:tp?Math.round(td/tp*100):null, tasksDone:td, tasksDue:tp,
    habitsPct:hp?Math.round(ha/hp*100):null, habitsDone:ha, habitsPlan:hp
  };
}

    // 滞后指标：显示名称 + 目标值，用填充条表示进度（不显示百分比数字）
    let lagHtml;
    if(lags.length>0){
      lagHtml=`<div class="lag-tags">`+lags.map(it=>{
        const rec=(state.indicatorLog[goal.id]&&state.indicatorLog[goal.id][w])||{};
        const pct=lagPct(it,rec[it.id]);
        const fill=pct!=null?pct:0;
        const col=scoreColor(pct);
        return `<span class="ltag"><span class="ltag-fill" style="width:${fill}%;background:${col}"></span><span class="ltag-txt">${esc(it.name||'未命名')} ${it.target!=null?esc(it.target):''}</span></span>`;
      }).join('')+`</div>`;
    } else {
      lagHtml=`<div class="pmeta" style="margin-top:5px">尚无滞后指标 · 点下方编辑添加</div>`;
    }
    h+=`<div class="proj">
      <div class="proj-head">
        <div class="ptitle" data-act="proj-open" data-gid="${goal.id}" style="cursor:pointer;flex:1">${esc(goal.title)}</div>
        <button class="btn sm proj-edit-btn" data-act="proj-open" data-gid="${goal.id}">✏️ 编辑项目</button>
      </div>
      ${goal.background?`<div class="pbg-toggle" data-act="toggle-pbg" data-gid="${goal.id}">📌 查看背景 ▾</div><div class="pbg-body" id="pbg-${goal.id}">${esc(goal.background)}</div>`:''}
      ${lagHtml}
    </div>`;
  });
  // —— 个人习惯（独立于项目） ——
  h+=`<div class="card"><p class="muted">🔆 <b>个人习惯</b> 不与任何项目关联，只记录你想长期养成的习惯（如运动、冥想、读书）。</p><button class="btn primary full" data-act="personal-habit-add" style="margin-top:8px">🔆 新建个人习惯</button></div>`;
  if(personal&&(personal.habits||[]).length>0){
    h+=`<div class="card"><div class="ph-list">`;
    (personal.habits||[]).forEach(hb=>{
      const days=getHabitDays(hb.id,w);
      const done=days.filter(Boolean).length;
      const plan=hb.perWeek||1;
      h+=`<div class="ph-item" data-gid="${PERSONAL_ID}" data-hid="${hb.id}"><div class="ph-name" data-act="habit-edit" data-gid="${PERSONAL_ID}" data-hid="${hb.id}">${esc(hb.title)}</div><div class="ph-sub">本周 ${done}/${plan} 次 · 始于 ${hb.startDate||'—'}</div></div>`;
    });
    h+=`</div><button class="btn sm full" data-act="proj-open" data-gid="${PERSONAL_ID}" style="margin-top:8px">管理 / 打卡 →</button></div>`;
  } else {
    h+=`<div class="card"><p class="empty" style="padding:6px 0">还没有个人习惯，点上方「新建个人习惯」添加。</p></div>`;
  }
  h+=`</div>`; return h;
}

/* 项目详情页 */
function viewProjectDetail(gid){
  const g=findGoal(gid);
  if(!g){currentProjectId=null;return viewProjects();}
  const w=state.currentWeek;
  const lags=g.lagging||[];
  let h='';
  h+=`<div class="page-header"><div class="ph-row"><div><h1>🎯 ${esc(g.title)}</h1><p>第 ${w} 周 · 项目详情</p></div><button class="help-btn" data-act="proj-back">← 返回</button></div></div>`;
  h+=`<div class="pad">`;

  // 区域一：滞后指标（可直接在此填写实际值）
  h+=`<div class="card"><h3>📈 滞后指标</h3><p class="muted" style="font-size:11px;margin:-3px 0 6px">填入实际值后自动计算达成率</p>`;
  if(lags.length===0) h+=`<p class="empty">还没有滞后指标。点下方「管理」添加。</p>`;
  else lags.forEach(it=>{
    const rec=(state.indicatorLog[g.id]&&state.indicatorLog[g.id][w])||{};
    const actual=rec[it.id];
    const pct=lagPct(it,actual);
    const dirL=it.dir==='down'?'↓越低越好':'↑越高越好';
    const fill=pct!=null?pct:0;
    const col=scoreFill(pct);
    h+=`<div class="lag-row">
      <div class="lag-name">${esc(it.name||'未命名')}<span class="lag-pct2" style="color:${scoreColor(pct)};flex:0 0 auto;margin-left:auto">${pct!=null?pct+'%':'—'}</span></div>
      <div class="lag-sub">目标 ${it.target!=null?esc(it.target):'?'} · ${dirL}</div>
      <div class="lag-input-row">
        <input class="lag-actual2" data-lagactual="1" data-goal="${g.id}" data-lag="${it.id}" data-w="${w}" type="number" placeholder="输入实际值…" value="${actual!=null?esc(actual):''}"/>
      </div>
      <div class="pp-bar"><i style="width:${fill}%;background:${col}"></i></div>
    </div>`;
  });
  h+=`</div>`;

  // 区域三：习惯（本周）+ 任务（按周）
  const wkHabits=(g.habits||[]).filter(hb=>habitActiveInWeek(hb,w));
  h+=`<div class="card"><div class="row between" style="margin-bottom:6px"><h3 style="margin:0">🔁 本周习惯 (${wkHabits.length})</h3><button class="btn sm" data-act="detail-add-habit" data-gid="${g.id}" style="flex:0 0 auto">＋ 添加</button></div>`;
  if(wkHabits.length===0) h+=`<p class="empty">本周没有习惯。</p>`;
  else{
    h+=`<div class="day-names">${DAY_NAMES.map((n,i)=>`<span${i===state.currentDay?' style="color:var(--indigo);font-weight:800;"':''}>${n}</span>`).join('')}</div>`;
    wkHabits.forEach(hb=>{
      const days=getHabitDays(hb.id,w);
      const done=days.filter(Boolean).length;
      const plan=hb.perWeek||1;
      const pct=plan?Math.round(done/plan*100):0;
      h+=`<div class="habit-item" data-gid="${g.id}" data-hid="${hb.id}"><div class="h-head"><div class="h-title" data-act="habit-edit" data-gid="${g.id}" data-hid="${hb.id}">${esc(hb.title)}</div><div class="h-pct">${pct}%</div></div><div class="h-sub">始于 ${hb.startDate||'—'} · 本周 ${done}/${plan} 次</div><div class="day-grid">`;
      for(let di=0;di<7;di++){const isOn=days[di];const cls=isOn?' on':'';const fut=(di>state.currentDay)?' future':'';h+=`<div class="day-chk${cls}${fut}" data-act="habit-day" data-hid="${hb.id}" data-w="${w}" data-d="${di}">${isOn?'✓':''}</div>`;}
      h+=`</div></div>`;
    });
  }
  h+=`</div>`;

  h+=`<div class="card"><h3 style="margin:0;margin-bottom:6px">✅ 任务（按周）<span class="muted" style="font-size:11px;font-weight:500;margin-left:6px">拖动任务到其他周可移动</span></h3>`;
  let anyTask=false;
  for(let wi=1;wi<=12;wi++){
    const wkTasks=(g.tasks||[]).filter(t=>t.week===wi);
    // 即使该周没任务也显示周标题（方便拖入 + 添加）
    const isCur=(wi===w);
    h+=`<div class="wk-group" data-wk-group="${g.id}-${wi}">
      <div class="wk-toggle" data-act="wk-toggle" data-gid="${g.id}" data-wk="${wi}">
        <span>第 ${wi} 周${isCur?' · 本周':''}${wkTasks.length>0?' ('+wkTasks.length+')':''}</span>
        <span style="display:flex;align-items:center;gap:4px">
          <button class="wk-add" data-act="wk-add-task" data-gid="${g.id}" data-wk="${wi}">＋</button>
          <span class="wk-arrow">${isCur?'▾':'▸'}</span>
        </span>
      </div>
      <div class="wk-body${isCur?' show':''}" id="wk-${g.id}-${wi}">`;
    if(wkTasks.length>0){
      anyTask=true;
      wkTasks.forEach(t=>{
        const done=!!(t.log&&t.log[wi]);
        h+=`<div class="item${done?' done':''}" data-drag-task="${t.id}" data-drag-gid="${g.id}" data-g="${g.id}" data-t="${t.id}" data-w="${wi}"><div class="grip" draggable="true" title="拖动到其他周"></div><div class="chk" data-act="task-toggle" data-g="${g.id}" data-t="${t.id}" data-w="${wi}">${done?'✓':''}</div><div class="it-title" data-act="task-edit" data-g="${g.id}" data-t="${t.id}" data-w="${wi}">${esc(t.title)}</div></div>`;
      });
    }
    h+=`</div></div>`;
  }
  if(!anyTask) h+=`<p class="empty">还没有任务。点各周的 ＋ 添加。</p>`;
  h+=`</div>`;

  h+=`<div class="pacts" style="padding:0 14px 6px"><button class="btn sm danger" data-act="proj-del" data-gid="${g.id}">🗑 删除项目</button></div>`;
  h+=`</div>`; return h;
}

/* ============================ 复盘视图 ============================ */
function viewReview(){
  if(currentReviewGid) return viewReviewDetail(currentReviewGid);
  const w=state.viewWeek;
  const cyclePct=Math.round(w/12*100);
  let h=`<div class="page-header"><div class="ph-row"><div><h1>📊 第 ${w} 周复盘</h1><p>共 12 周 · 进度 ${cyclePct}%</p></div><button class="help-btn" data-act="help">📖</button></div></div>`;
  h+=`<div class="pad">`;
  // 周导航
  h+=`<div class="card"><div class="weekbar">
    <button class="btn sm" data-act="week-prev"${w<=1?' disabled':''}>‹ 上周</button>
    <button class="btn sm" data-act="week-now">本周</button>
    <button class="btn sm" data-act="week-next"${w>=12?' disabled':''}>下周 ›</button>
  </div><div class="progress"><i style="width:${cyclePct}%"></i></div>
  <div class="weekdots">${Array.from({length:12},(_,i)=>{const n=i+1;const cs=scoreWeek(n);const cls=n===w?'on':(cs.tasksPct!==null||cs.habitsPct!==null?'done':'');return`<button class="dot ${cls}" data-act="week-set" data-w="${n}">${n}</button>`;}).join('')}</div></div>`;

  // 本周感悟（按周保存，独立于项目）
  const wjv=(state.weekJournal&&state.weekJournal[w])||'';
  h+=`<div class="card"><details class="jbox"${wjv?' open':''}>
    <summary class="jsum">📝 本周感悟${wjv?' · 已写':''}</summary>
    <textarea class="jarea" data-weekjournal="${w}" placeholder="这一周执行得怎么样？卡点在哪、下周怎么调？…">${esc(wjv)}</textarea>
    <div class="jhint">按第 ${w} 周自动保存</div>
  </details></div>`;

  if(state.goals.length===0){
    h+=`<div class="empty">还没有项目。去「项目」页添加吧。</div>`;
  } else {
    // 按项目分卡片
    state.goals.forEach(g=>{
      const lags=g.lagging||[];
      // 滞后指标精简标签（个人习惯无滞后指标，跳过）
      let lagHtml='';
      if(g._personal){
        lagHtml='';
      } else if(lags.length>0){
        lagHtml=`<div class="rev-lag-mini">`+lags.map(it=>{
          const rec=(state.indicatorLog[g.id]&&state.indicatorLog[g.id][w])||{};
          const pct=lagPct(it,rec[it.id]);
          const col=scoreColor(pct);
          return `<span class="rlm-tag" style="color:${col};border-color:${col}22;background:${col}11">${esc(it.name||'?')} ${pct!=null?pct+'%':'—'}</span>`;
        }).join('')+`</div>`;
      } else {
        lagHtml=`<div class="pmeta" style="font-size:10.5px;color:var(--muted)">尚无滞后指标 · 点开设置</div>`;
      }
      // 每周引领指标柱状图（颜色按真实时间：未到的周=灰，已到的周按完成度红/黄/绿；选中周描边，本周固定标注）
      const curW=state.currentWeek;
      let bars='';
      for(let wi=1;wi<=12;wi++){
        const sc=projectWeekScore(g,wi);
        const avg=(sc.tasksPct!=null&&sc.habitsPct!=null)?Math.round((sc.tasksPct+sc.habitsPct)/2):(sc.tasksPct||sc.habitsPct||0);
        const bh=Math.max(4,Math.round(avg*0.68));
        const isSel=(wi===w);        // 当前查看/选中的周 → 描边
        const isNow=(wi===curW);     // 真实本周（固定，跟随日期）
        const isFuture=(wi>curW);    // 真实时间还没到的周 → 灰色
        const bCol=isFuture?'#cbd5e1':(avg>=85?'#10b981':avg>=50?'#f59e0b':'#ef4444');
        bars+=`<div class="bc-col" data-act="rev-bar" data-gid="${g.id}" data-wk="${wi}" style="cursor:pointer">
          <div class="bc-bar${isSel?' sel':''}" style="height:${bh}px;background:${bCol}"><span class="bc-pct-in"${isFuture?' style="color:var(--muted)"':''}>${avg>0?avg:''}</span></div>
          <span class="bc-lbl">${wi}${isNow?'<span class="bc-now">·本周</span>':''}</span>
        </div>`;
      }

      h+=`<div class="rev-card">
        <button class="rev-detail-btn" data-act="rev-week-detail" data-gid="${g.id}">查看该周详情 ›</button>
        <div class="rctitle">${esc(g.title)}</div>
        ${lagHtml}
        <div class="bar-chart">${bars}</div>
        <div class="muted" style="font-size:9.5px;text-align:center;margin-top:2px">↑ 每周引领指标完成度（柱高=%）· 点柱子看该周详情</div>
      </div>`;
    });
  }

  h+=`</div>`; return h;
}

/* 复盘详情页（点击项目卡进入） */
function viewReviewDetail(gid){
  const g=findGoal(gid);
  if(!g){currentReviewGid=null;return viewReview();}
  const w=state.viewWeek;
  const sc=projectWeekScore(g,w);
  const lags=g.lagging||[];

  let h=`<div class="page-header"><div class="ph-row"><div><h1>📊 ${esc(g.title)}</h1><p>第 ${w} 周复盘详情</p></div><button class="help-btn" data-act="review-back">← 返回</button></div></div>`;
  h+=`<div class="pad">`;

  // 区域一：滞后指标（可填实际值）
  h+=`<div class="card"><h3>📈 滞后指标登记</h3>`;
  if(lags.length===0) h+=`<p class="empty">还没有滞后指标。去「项目」页编辑添加。</p>`;
  else{
    lags.forEach(it=>{
      const rec=(state.indicatorLog[g.id]&&state.indicatorLog[g.id][w])||{};
      const actual=rec[it.id];
      const pct=lagPct(it,actual);
      const dirL=it.dir==='down'?'↓越低越好':'↑越高越好';
      const fill=pct!=null?pct:0;
      const col=scoreFill(pct);
      h+=`<div class="lag-row">
        <div class="lag-name">${esc(it.name||'未命名')}<span class="lag-pct2" style="color:${scoreColor(pct)};flex:0 0 auto;margin-left:auto">${pct!=null?pct+'%':'—'}</span></div>
        <div class="lag-sub">目标 ${it.target!=null?esc(it.target):'?'} · ${dirL}</div>
        <div class="lag-input-row">
          <input class="lag-actual2" data-lagactual="1" data-goal="${g.id}" data-lag="${it.id}" data-w="${w}" type="number" placeholder="实际值" value="${actual!=null?esc(actual):''}"/>
        </div>
        <div class="pp-bar"><i style="width:${fill}%;background:${col}"></i></div>
      </div>`;
    });
    h+=`<p class="hint">填实际值后自动算达成率</p>`;
  }
  h+=`</div>`;

  // 区域二：本周任务（完成 / 未完成 + 移到下周）
  const wkTasks=(g.tasks||[]).filter(t=>t.week===w);
  const doneTasks=wkTasks.filter(t=>!!(t.log&&t.log[w]));
  const undoneTasks=wkTasks.filter(t=>!t.log||!t.log[w]);
  const taskPct=sc.tasksPct||0;

  h+=`<div class="card"><h3>✅ 本周任务 (${wkTasks.length})</h3>
    <div class="pp-info"><span class="pp-label">完成 ${doneTasks.length}/${wkTasks.length}</span><span class="pp-pct" style="color:${scoreColor(taskPct)}">${taskPct}%</span></div>
    <div class="pp-bar"><i style="width:${taskPct}%;background:${scoreFill(taskPct)}"></i></div>`;

  if(wkTasks.length===0) h+=`<p class="empty">本周没有安排任务。</p>`;
  else{
    if(doneTasks.length>0){
      h+=`<div class="sec-title" style="margin-top:8px">已完成 (${doneTasks.length})</div>`;
      doneTasks.forEach(t=>{
        h+=`<div class="item done" data-g="${g.id}" data-t="${t.id}" data-w="${w}"><div class="chk" data-act="task-toggle" data-g="${g.id}" data-t="${t.id}" data-w="${w}">✓</div><div class="it-title" data-act="task-edit" data-g="${g.id}" data-t="${t.id}" data-w="${w}">${esc(t.title)}</div></div>`;
      });
    }
    if(undoneTasks.length>0){
      h+=`<div class="sec-title" style="margin-top:8px">未完成 (${undoneTasks.length})</div>`;
      undoneTasks.forEach(t=>{
        h+=`<div class="item" data-g="${g.id}" data-t="${t.id}" data-w="${w}"><div class="chk" data-act="task-toggle" data-g="${g.id}" data-t="${t.id}" data-w="${w}"></div><div class="it-title" data-act="task-edit" data-g="${g.id}" data-t="${t.id}" data-w="${w}">${esc(t.title)}</div><button class="btn-nextwk" data-act="task-move-next" data-gid="${g.id}" data-tid="${t.id}" data-w="${w}">复制到下一週 →</button></div>`;
      });
    }
  }
  h+=`</div>`;

  // 区域三：本周习惯
  const wkHabits=(g.habits||[]).filter(hb=>habitActiveInWeek(hb,w));
  const habitPct=sc.habitsPct||0;

  h+=`<div class="card"><h3>🔁 本周习惯 (${wkHabits.length})</h3>
    <div class="pp-info"><span class="pp-label">完成 ${sc.habitsDone}/${sc.habitsPlan}次</span><span class="pp-pct" style="color:${scoreColor(habitPct)}">${habitPct}%</span></div>
    <div class="pp-bar"><i style="width:${habitPct}%;background:${scoreFill(habitPct)}"></i></div>`;

  if(wkHabits.length===0) h+=`<p class="empty">本周没有习惯。</p>`;
  else{
    h+=`<div class="day-names">${DAY_NAMES.map((n,i)=>`<span${i===state.currentDay?' style="color:var(--indigo);font-weight:800;"':''}>${n}</span>`).join('')}</div>`;
    wkHabits.forEach(hb=>{
      const days=getHabitDays(hb.id,w);
      const done=days.filter(Boolean).length;
      const plan=hb.perWeek||1;
      const pct=plan?Math.round(done/plan*100):0;
      h+=`<div class="habit-item"><div class="h-head"><div class="h-title" data-act="habit-edit" data-gid="${g.id}" data-hid="${hb.id}">${esc(hb.title)}</div><div class="h-pct">${pct}%</div></div><div class="h-sub">${done}/${plan}次</div><div class="day-grid">`;
      for(let di=0;di<7;di++){const isOn=days[di];const cls=isOn?' on':'';const fut=(di>state.currentDay)?' future':'';h+=`<div class="day-chk${cls}${fut}" data-act="habit-day" data-hid="${hb.id}" data-w="${w}" data-d="${di}">${isOn?'✓':''}</div>`;}
      h+=`</div></div>`;
    });
  }
  h+=`</div>`;
  // 区域四：本周感悟（每周 + 每日，按日期）—— 独立于「是否有习惯」，始终渲染
  const wjv=(state.weekJournal&&state.weekJournal[w])||'';
  const dates=weekDates(w);
  const dailyList=dates.map(dt=>{ const k=fmtDate(dt); const v=(state.journal&&state.journal[k])||''; return v?{k,v,dt}:null; }).filter(Boolean);
  let refl=`<div class="card"><h3>📝 本周感悟</h3>`;
  if(!wjv && dailyList.length===0){ refl+=`<p class="empty">这一周还没有写任何感悟。</p>`; }
  else{
    if(wjv) refl+=`<div class="refl-week">${esc(wjv)}</div>`;
    if(dailyList.length>0){
      refl+=`<div class="refl-sub">🗒 每日感悟（按日期）</div>`;
      dailyList.forEach(o=>{
        const wd=DAY_NAMES[((o.dt.getDay()+6)%7)];
        refl+=`<div class="refl-day"><span class="refl-date">${o.k} · 周${wd}</span><div class="refl-txt">${esc(o.v)}</div></div>`;
      });
    }
  }
  refl+=`</div>`;
  h+=refl;
  h+=`</div>`;
  return h;
}

function bindView(){
  // 滞后指标实际值输入
  document.querySelectorAll('[data-lagactual]').forEach(el=>{
    el.addEventListener('input',e=>{
      const g=findGoal(e.target.dataset.goal); if(!g)return;
      const w=e.target.dataset.w,lid=e.target.dataset.lag;
      state.indicatorLog[g.id]=state.indicatorLog[g.id]||{};
      state.indicatorLog[g.id][w]=state.indicatorLog[g.id][w]||{};
      const v=e.target.value===''?null:Number(e.target.value);
      if(v===null||isNaN(v)) delete state.indicatorLog[g.id][w][lid];
      else state.indicatorLog[g.id][w][lid]=v; save();
    });
    el.addEventListener('blur',()=>toast('✅ 已保存'));
  });
  // 今日感悟（按日期）
  document.querySelectorAll('[data-journal]').forEach(el=>{
    const key=el.dataset.journal;
    el.addEventListener('input',e=>{
      state.journal=state.journal||{};
      const v=e.target.value;
      if(v.trim()==='')delete state.journal[key]; else state.journal[key]=v;
      save();
    });
    el.addEventListener('blur',()=>{ if(el.value.trim()!=='')toast('✅ 今日感悟已保存'); });
  });
  // 本周感悟（按周）
  document.querySelectorAll('[data-weekjournal]').forEach(el=>{
    const wk=el.dataset.weekjournal;
    el.addEventListener('input',e=>{
      state.weekJournal=state.weekJournal||{};
      const v=e.target.value;
      if(v.trim()==='')delete state.weekJournal[wk]; else state.weekJournal[wk]=v;
      save();
    });
    el.addEventListener('blur',()=>{ if(el.value.trim()!=='')toast('✅ 本周感悟已保存'); });
  });
  bindLongPress();
}

/* AI merge helpers */
function toLag(v){return Array.isArray(v)?v.filter(x=>x&&(x.name||x.text)).map(x=>({id:uid(),name:String(x.name||x.text||''),target:(x.target==null||x.target==='')?null:Number(x.target),dir:(x.dir==='down'?'down':'up')})):[];}
function mergeLag(existing,ai){const arr=(existing||[]).slice();const have=new Set(arr.map(x=>String(x.name||'').trim().toLowerCase()));toLag(ai).forEach(it=>{const k=String(it.name||'').trim().toLowerCase();if(k&&!have.has(k)){arr.push(it);have.add(k);}});return arr;}
function toHabit(v){return Array.isArray(v)?v.filter(x=>x&&(x.title||x.text)).map(x=>{const w=Math.max(1,Math.min(12,+(x.suggestedWeek||1)||1));return{id:uid(),title:String(x.title||x.text||''),weeks:Array.from({length:13-w},(_,i)=>w+i),perWeek:Math.max(1,Math.min(7,+(x.perWeek||1)||1)),startDate:null,log:{}};}):[];}
function mergeHabits(existing,ai){const arr=(existing||[]).slice();const have=new Set(arr.map(x=>String(x.title||'').trim().toLowerCase()));toHabit(ai).forEach(it=>{const k=String(it.title||'').trim().toLowerCase();if(k&&!have.has(k)){arr.push(it);have.add(k);}});return arr;}
function toTask(v){return Array.isArray(v)?v.filter(x=>x&&(x.title||x.text)).map(x=>{const w=Math.max(1,Math.min(12,+(x.suggestedWeek||1)||1));return{id:uid(),title:String(x.title||x.text||''),week:w,log:{}};}):[];}
function mergeTasks(existing,ai){const arr=(existing||[]).slice();const have=new Set(arr.map(x=>String(x.title||'').trim().toLowerCase()));toTask(ai).forEach(it=>{const k=String(it.title||'').trim().toLowerCase();if(k&&!have.has(k)){arr.push(it);have.add(k);}});return arr;}

async function runPlanAI(g){
  planLoading=true;openPlan(g);
  try{
    const text=await aiChat(SYS_PLAN,'目标：'+g.title+'\n背景：'+(g.background||'（无）'));
    const d=parseJSON(text);if(!d||!Array.isArray(d.habits)||!Array.isArray(d.tasks))throw new Error('格式异常');
    g.lagging=mergeLag(g.lagging,d.lagging);
    g.habits=mergeHabits(g.habits,d.habits);
    g.tasks=mergeTasks(g.tasks,d.tasks);
    save();toast('AI 已补充（可增删/修改）');
  }catch(err){toast(err.message==='NO_KEY'?'请先在「设置」填 API Key':'AI 失败：'+err.message+'（可手动填写）');}
  finally{planLoading=false;openPlan(g);}
}

function weekOpts(sel){return Array.from({length:12},(_,i)=>{const n=i+1;return`<option${n===sel?' selected':''}>${n}</option>`;}).join('');}

      <button class="del sm" data-act="plan-hab-del" data-iid="${hb.id}">✕</button>
    </div></div>`;}).join('')||'<p class="muted" style="padding:4px 0">还没有习惯</p>';

  const taskRows=(g.tasks||[]).map(tk=>`<div class="plan-row">
    <input class="plan-in" data-tk="title" data-iid="${tk.id}" placeholder="任务名称" value="${esc(tk.title||'')}"/>

  const spin=planLoading?`<div style="display:flex;align-items:center;gap:7px;justify-content:center;color:var(--muted);font-size:12.5px;padding:14px 0;margin-top:6px"><span class="spinner"></span>AI 正在分解…</div>`:'';

function bindPlan(){
  const root=document.querySelector('#modal .sheet');if(!root)return;
  root.__g=currentModalGoal;
  const handler=e=>{const el=e.target;if(el&&(el.dataset.lk||el.dataset.hk||el.dataset.tk))planWrite(root.__g,el);};
  root.addEventListener('input',handler);root.addEventListener('change',handler);
}
function planWrite(g,el){
  const k=el.dataset.lk||el.dataset.hk||el.dataset.tk;if(!k||!g)return;
  const id=el.dataset.iid;
  if(el.dataset.lk){const it=(g.lagging||[]).find(x=>x.id===id);if(!it)return;if(k==='name')it.name=el.value;else if(k==='target')it.target=el.value===''?null:Number(el.value);else if(k==='dir')it.dir=el.value;}
  else if(el.dataset.hk){const hb=(g.habits||[]).find(x=>x.id===id);if(!hb)return;if(k==='title')hb.title=el.value;else if(k==='week'){const w=+el.value;hb.weeks=Array.from({length:13-w},(_,i)=>w+i);}else if(k==='perWeek')hb.perWeek=+el.value;else if(k==='startDate')hb.startDate=el.value||null;}
  else if(el.dataset.tk){const tk=(g.tasks||[]).find(x=>x.id===id);if(!tk)return;if(k==='title')tk.title=el.value;else if(k==='week')tk.week=+el.value;else if(k==='priority')tk.priority=el.value;else if(k==='due')tk.due=el.value||null;}
  save();
}

/* ============================ 任务拖拽（跨周移动） ============================ */
let _dragTaskId=null,_dragGid=null;
function initDrag(){
  // 桌面端 HTML5 DnD
  document.addEventListener('dragstart',e=>{
    const gripEl=e.target.closest('.grip');
    const item = gripEl ? gripEl.closest('[data-drag-task]') : e.target.closest('[data-drag-task]');
    if(!item)return;_dragTaskId=item.dataset.dragTask;_dragGid=item.dataset.dragGid;item.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',_dragTaskId);
    if(gripEl && typeof e.dataTransfer.setDragImage==='function') e.dataTransfer.setDragImage(item,12,12);
    setTimeout(()=>item.style.display='none',0);
  });
  document.addEventListener('dragend',e=>{
    document.querySelectorAll('.item.dragging').forEach(el=>{el.classList.remove('dragging');el.style.display='';});
    document.querySelectorAll('.drop-over').forEach(el=>el.classList.remove('drop-over'));
    _dragTaskId=null;_dragGid=null;
  });
  document.addEventListener('dragover',e=>{
    if(!_dragTaskId)return;e.preventDefault();e.dataTransfer.dropEffect='move';
    const drop=e.target.closest('[data-drop]');
    const grp=e.target.closest('[data-wk-group]');
    document.querySelectorAll('.drop-over').forEach(el=>el.classList.remove('drop-over'));
    if(drop)drop.classList.add('drop-over');
    else if(grp)grp.classList.add('drop-over');
  });
  document.addEventListener('drop',e=>{
    e.preventDefault();if(!_dragTaskId)return;
    const drop=e.target.closest('[data-drop]');
    const grp=e.target.closest('[data-wk-group]');
    document.querySelectorAll('.drop-over').forEach(el=>el.classList.remove('drop-over'));
    if(drop&&_dragGid){
      setMustDo(_dragGid,_dragTaskId, drop.dataset.drop==='mustdo');
    } else if(grp){
      const parts=grp.dataset.wkGroup.split('-');
      const targetGid=parts[0],targetWk=+parts[1];
      if(targetGid!==_dragGid||!targetWk)return;
      moveTaskToWeek(_dragGid,_dragTaskId,targetWk);
    }
  });
  // 移动端触摸拖拽
  let _touchEl=null,_touchGhost=null,_touchStartX=0,_touchStartY=0,_touchMoved=false;
  function _startTouchDrag(item,e){ _touchEl=item;_touchMoved=false;const t=e.touches[0];_touchStartX=t.clientX;_touchStartY=t.clientY; }
  document.addEventListener('touchstart',e=>{
    // 今天页：必须抓最左侧手柄才启动拖动；项目视图：仍允许整行拖动
    const gripEl=e.target.closest('.grip');
    if(gripEl){ const item=gripEl.closest('[data-drag-task]'); if(item)_startTouchDrag(item,e); return; }
    const item=e.target.closest('[data-drag-task]');
    if(item && item.closest('[data-wk-group]')) _startTouchDrag(item,e);
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!_touchEl||!_touchEl.dataset.dragTask)return;
    const t=e.touches[0];
    const dx=Math.abs(t.clientX-_touchStartX),dy=Math.abs(t.clientY-_touchStartY);
    if(dx>10||dy>10)_touchMoved=true;
    if(!_touchMoved)return;
    e.preventDefault();
    // 创建 ghost
    if(!_touchGhost){
      _dragTaskId=_touchEl.dataset.dragTask;_dragGid=_touchEl.dataset.dragGid;
      _touchGhost=_touchEl.cloneNode(true);_touchGhost.style.position='fixed';_touchGhost.style.zIndex='9999';
      _touchGhost.style.width=_touchEl.offsetWidth+'px';_touchGhost.style.opacity='.85';
      _touchGhost.style.pointerEvents='none';_touchGhost.style.boxShadow='0 8px 24px rgba(30,41,59,.2)';
      _touchGhost.style.borderRadius='12px';_touchGhost.style.background='#fff';_touchGhost.style.padding='10px';
      document.body.appendChild(_touchGhost);_touchEl.style.opacity='.3';
    }
    _touchGhost.style.left=(t.clientX-_touchEl.offsetWidth/2)+'px';_touchGhost.style.top=(t.clientY-20)+'px';
    // 高亮目标（今天必做 / 本周待办 / 项目周组）
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const drop=el?el.closest('[data-drop]'):null;
    const grp=el?el.closest('[data-wk-group]'):null;
    document.querySelectorAll('.drop-over').forEach(x=>x.classList.remove('drop-over'));
    if(drop)drop.classList.add('drop-over');
    else if(grp)grp.classList.add('drop-over');
  },{passive:false});
  document.addEventListener('touchend',()=>{
    if(_touchGhost){
      const drop=document.querySelector('.drop-over');
      if(drop&&_dragTaskId&&_dragGid){
        if(drop.dataset.drop) setMustDo(_dragGid,_dragTaskId, drop.dataset.drop==='mustdo');
        else if(drop.dataset.wkGroup){
          const parts=drop.dataset.wkGroup.split('-');
          const targetGid=parts[0],targetWk=+parts[1];
          if(targetGid===_dragGid)moveTaskToWeek(_dragGid,_dragTaskId,targetWk);
        }
      }
      document.querySelectorAll('.drop-over').forEach(x=>x.classList.remove('drop-over'));
      _touchGhost.remove();_touchGhost=null;
      if(_touchEl)_touchEl.style.opacity='';
    }
    _touchEl=null;_touchMoved=false;_dragTaskId=null;_dragGid=null;
  });
}
function moveTaskToWeek(gid,tid,newWeek){
  const g=findGoal(gid);if(!g)return;
  const tk=g.tasks.find(x=>x.id===tid);if(!tk)return;
  if(tk.week===newWeek){toast('任务已在第 '+newWeek+' 周');return;}
  const old=tk.week;tk.week=newWeek;save();render();toast(`已从第 ${old} 周移到第 ${newWeek} 周`);
}

/* ============================ 启动 ============================ */
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;
  if(view==='projects')currentProjectId=null;
  if(view==='review'){ state.viewWeek=state.currentWeek; currentReviewGid=null; }
  render();
});
render();
initDrag();
if(!state.settings.apiKey) toast('提示：先在「设置」填写 AI 的 API Key');
</script>
